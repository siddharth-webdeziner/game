<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wonderland Arcade for Kids 🎈🐾⭐</title>
  <style>
    :root {
      --primary: #ff6b6b;
      --secondary: #4ecdc4;
      --accent: #ffe66d;
      --bg: #f7fff7;
      --text: #2f3e46;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: var(--text);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #ff4757;
      text-shadow: 2px 2px #ffffff;
    }

    .nav-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mobile-game-menu {
      display: none;
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
    }

    .mobile-game-menu label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
      color: #2f3e46;
    }

    .mobile-game-menu select {
      width: 100%;
      padding: 14px 16px;
      border: 3px solid #fff;
      border-radius: 18px;
      background: #fff;
      color: #333;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      outline: none;
    }

    .nav-btn {
      padding: 12px 24px;
      border: 3px solid #fff;
      border-radius: 50px;
      background: #fff;
      color: #333;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateY(-3px) scale(1.05);
    }

    .nav-btn.active {
      background: #ff4757;
      color: #fff;
    }

    .game-container {
      background: #ffffffdd;
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 25px;
      width: 100%;
      max-width: 650px;
      min-height: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .music-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 21, 34, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(2px);
    }

    .music-start-btn {
      background: linear-gradient(135deg, #ff6b6b, #ff9f43);
      color: white;
      border: none;
      padding: 18px 30px;
      font-size: 1.3rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .milestone-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      pointer-events: auto;
      animation: fadeIn 0.25s ease;
    }

    .milestone-card {
      background: linear-gradient(135deg, #fff7b3, #ffd6e0);
      border: 4px solid #fff;
      border-radius: 28px;
      padding: 25px 35px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
      transform: scale(0.8);
      animation: popIn 0.5s ease forwards;
      max-width: 80vw;
      position: relative;
      z-index: 10000;
    }

    .milestone-icon {
      font-size: 3rem;
      margin-bottom: 10px;
      animation: bounce 0.8s ease infinite alternate;
    }

    .milestone-text {
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-weight: 900;
      color: #ff4757;
      text-shadow: 2px 2px #fff;
      margin-bottom: 18px;
    }

    .milestone-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b6b, #ff9f43);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
      visibility: visible;
      opacity: 1;
    }

    @keyframes popIn {
      to { transform: scale(1); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .score-board {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #2ed573;
      background: #fff;
      padding: 6px 18px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* Game 1: Balloon Pop */
    #balloon-box {
      width: 100%;
      height: 320px;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: linear-gradient(180deg, #87CEEB, #E0F6FF);
      border: 3px dashed #70a1ff;
    }

    .target-cue {
      font-size: 1.4rem;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .balloon {
      position: absolute;
      width: 55px;
      height: 70px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.15);
      animation: floatUp 4s linear forwards;
    }

    .balloon::after {
      content: "▲";
      position: absolute;
      bottom: -8px;
      font-size: 10px;
      color: inherit;
    }

    @keyframes floatUp {
      0% { bottom: -80px; }
      100% { bottom: 330px; }
    }

    /* Game 2: Animal Memory Match */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      aspect-ratio: 1;
      background: #ffa502;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      cursor: pointer;
      transition: transform 0.3s;
      border: 3px solid #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .card.flipped {
      background: #ffffff;
      transform: rotateY(180deg);
    }

    .card.matched {
      background: #7bed9f;
      cursor: default;
    }

    /* Game 3: Star Math Quest */
    .math-card {
      text-align: center;
      width: 100%;
    }

    .math-problem {
      font-size: 3rem;
      font-weight: 900;
      color: #3742fa;
      margin-bottom: 20px;
    }

    .math-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
    }

    .math-btn {
      background: #70a1ff;
      border: none;
      color: white;
      font-size: 1.8rem;
      font-weight: bold;
      padding: 15px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 5px 0 #1e90ff;
      transition: transform 0.1s;
    }

    .math-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #1e90ff;
    }

    .color-grid,
    .number-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 420px;
      margin: 20px auto 0;
    }

    .color-tile,
    .number-btn {
      border: 3px solid #fff;
      border-radius: 18px;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.12);
      transition: transform 0.15s ease;
      min-height: 90px;
      font-size: 1.2rem;
    }

    .color-tile:active,
    .number-btn:active {
      transform: scale(0.98);
    }

    .number-btn {
      background: linear-gradient(135deg, #7bed9f, #2ed573);
      min-height: 70px;
      font-size: 2rem;
    }

    /* Game 4: Alphabet Tracing */
    #drawing-canvas {
      border: 3px solid #70a1ff;
      border-radius: 16px;
      cursor: crosshair;
      background: #ffffff;
      display: block;
      touch-action: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .alphabet-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .letter-btn {
      width: 40px;
      height: 40px;
      border: 2px solid #fff;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    .letter-btn:hover {
      transform: scale(1.1);
    }

    .letter-btn.active {
      border: 3px solid #000;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.2);
    }

    .canvas-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    .control-btn {
      padding: 8px 16px;
      background: #ff6b6b;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    .control-btn:hover {
      background: #ff5252;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .nav-bar {
        display: none;
      }

      .mobile-game-menu {
        display: block;
      }

      header h1 {
        font-size: 2rem;
      }

      body {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ Wonderland Kids Arcade ✨</h1>
    <p style="color: #57606f; font-weight: bold;">Choose a game to play!</p>
  </header>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchGame('balloons')">🎈 Balloon Pop</button>
    <button class="nav-btn" onclick="switchGame('memory')">🐾 Animal Cards</button>
    <button class="nav-btn" onclick="switchGame('math')">⭐ Star Math</button>
    <button class="nav-btn" onclick="switchGame('alphabet')">✏️ ABC Trace</button>
    <button class="nav-btn" onclick="switchGame('colors')">🎨 Color Match</button>
    <button class="nav-btn" onclick="switchGame('numbers')">🔢 Number Hop</button>
  </div>

  <div class="mobile-game-menu">
    <label for="gameMenu">Choose a game to play</label>
    <select id="gameMenu" onchange="switchGame(this.value)">
      <option value="balloons">🎈 Balloon Pop</option>
      <option value="memory">🐾 Animal Cards</option>
      <option value="math">⭐ Star Math</option>
      <option value="alphabet">✏️ ABC Trace</option>
      <option value="colors">🎨 Color Match</option>
      <option value="numbers">🔢 Number Hop</option>
    </select>
  </div>

  <div class="music-overlay" id="musicOverlay">
    <button class="music-start-btn" id="musicStartBtn">▶ Start Game</button>
  </div>

  <div class="game-container" id="gameArea"></div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const musicOverlay = document.getElementById('musicOverlay');
    const musicStartBtn = document.getElementById('musicStartBtn');
    const gameSelect = document.getElementById('gameSelect');
    let currentGame = 'balloons';
    let balloonInterval = null;
    let balloonTargetColor = '';
    let balloonScore = 0;
    const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6'];
    const colorNames = {
      '#ff4757': 'RED 🔴',
      '#2ed573': 'GREEN 🟢',
      '#1e90ff': 'BLUE 🔵',
      '#ffa502': 'ORANGE 🟠',
      '#9b59b6': 'PURPLE 🟣'
    };

    function playTone(freq, duration = 0.15) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playWowSound() {
      try {
        const audio = new Audio('sound/wow.mp3');
        audio.play().catch(() => {});
      } catch (e) {}
    }

    function playWrongSound() {
      try {
        const audio = new Audio('sound/wrong.mp3');
        audio.play().catch(() => {});
      } catch (e) {}
    }

    function showMilestoneDialog() {
      const existing = document.getElementById('milestoneOverlay');
      if (existing) existing.remove();

      const overlay = document.createElement('div');
      overlay.id = 'milestoneOverlay';
      overlay.className = 'milestone-overlay';
      overlay.innerHTML = `
        <div class="milestone-card">
          <div class="milestone-icon">🎉✨</div>
          <div class="milestone-text">You are doing great!</div>
          <button class="milestone-btn" onclick="this.closest('.milestone-overlay').remove()">Continue</button>
        </div>
      `;
      document.body.appendChild(overlay);
      playWowSound();
    }

    function checkMilestoneScore(score) {
      if (score > 0 && score % 100 === 0) {
        showMilestoneDialog();
      }
    }

    const backgroundMusic = new Audio('sound/bg.mp3');
    backgroundMusic.loop = true;
    backgroundMusic.volume = 0.35;
    backgroundMusic.preload = 'auto';

    function playBackgroundMusic() {
      try {
        backgroundMusic.currentTime = 0;
        backgroundMusic.play().catch(() => {});
      } catch (e) {}
    }

    function startMusicFromUserInteraction() {
      playBackgroundMusic();
      if (musicOverlay) {
        musicOverlay.style.display = 'none';
      }
    }

    document.addEventListener('pointerdown', startMusicFromUserInteraction, { once: true });
    if (musicStartBtn) {
      musicStartBtn.addEventListener('click', startMusicFromUserInteraction);
    }

    function switchGame(game) {
      currentGame = game;
      document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', 
          (idx === 0 && game === 'balloons') || 
          (idx === 1 && game === 'memory') || 
          (idx === 2 && game === 'math') ||
          (idx === 3 && game === 'alphabet') ||
          (idx === 4 && game === 'colors') ||
          (idx === 5 && game === 'numbers')
        );
      });
      const gameMenu = document.getElementById('gameMenu');
      if (gameMenu) {
        gameMenu.value = game;
      }
      clearInterval(balloonInterval);
      if (game === 'balloons') initBalloonGame();
      if (game === 'memory') initMemoryGame();
      if (game === 'math') initMathGame();
      if (game === 'alphabet') initAlphabetGame();
      if (game === 'colors') initColorGame();
      if (game === 'numbers') initNumberGame();
    }

    function handleGameSelectChange() {
      const selectedGame = gameSelect.value;
      switchGame(selectedGame);
    }

    /* ---------------- 1. BALLOON POP GAME ---------------- */
    function initBalloonGame() {
      balloonScore = 0;
      pickNewTargetColor();

      gameArea.innerHTML = `
        <div class="score-board">Score: <span id="b-score">0</span> ⭐</div>
        <div class="target-cue">Pop the <span id="b-target" style="color:${balloonTargetColor}">COLOR</span> balloon!</div>
        <div id="balloon-box"></div>
      `;
      updateTargetDisplay();

      balloonInterval = setInterval(spawnBalloon, 900);
    }

    function pickNewTargetColor() {
      balloonTargetColor = colors[Math.floor(Math.random() * colors.length)];
      setTimeout(playBackgroundMusic, 1000);
    }

    function updateTargetDisplay() {
      const targetSpan = document.getElementById('b-target');
      if (targetSpan) {
        targetSpan.textContent = colorNames[balloonTargetColor];
        targetSpan.style.color = balloonTargetColor;
      }
    }

    function spawnBalloon() {
      const box = document.getElementById('balloon-box');
      if (!box) return;

      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      const color = colors[Math.floor(Math.random() * colors.length)];
      balloon.style.backgroundColor = color;
      balloon.style.color = color;
      balloon.style.left = Math.random() * (box.clientWidth - 60) + 'px';

      balloon.onclick = () => {
        if (color === balloonTargetColor) {
          playWowSound();
          balloonScore += 10;
          document.getElementById('b-score').textContent = balloonScore;
          checkMilestoneScore(balloonScore);
          if (balloonScore % 30 === 0) {
            pickNewTargetColor();
            updateTargetDisplay();
          }
        } else {
          playWrongSound();
        }
        balloon.remove();
      };

      balloon.onanimationend = () => balloon.remove();
      box.appendChild(balloon);
    }

    /* ---------------- 2. ANIMAL MEMORY GAME ---------------- */
    const animals = ['🐶', '🐱', '🐰', '🦁', '🐼', '🐵'];
    let flippedCards = [];
    let matchedPairs = 0;

    function initMemoryGame() {
      matchedPairs = 0;
      flippedCards = [];
      const deck = [...animals, ...animals].sort(() => Math.random() - 0.5);

      gameArea.innerHTML = `
        <div class="score-board">Pairs Found: <span id="mem-score">0 / 6</span> 🎉</div>
        <div class="memory-grid" id="grid"></div>
      `;

      const grid = document.getElementById('grid');
      deck.forEach((animal, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.animal = animal;
        card.dataset.index = index;
        card.onclick = () => flipCard(card);
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
        return;
      }

      card.classList.add('flipped');
      card.textContent = card.dataset.animal;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        if (flippedCards[0].dataset.animal === flippedCards[1].dataset.animal) {
          playWowSound();
          flippedCards[0].classList.add('matched');
          flippedCards[1].classList.add('matched');
          flippedCards = [];
          matchedPairs++;
          document.getElementById('mem-score').textContent = `${matchedPairs} / 6`;
          checkMilestoneScore(matchedPairs);
          if (matchedPairs === 6) {
            setTimeout(() => alert('🌟 Great job! You found all the animal pairs! 🌟'), 300);
          }
        } else {
          playWrongSound();
          setTimeout(() => {
            flippedCards[0].classList.remove('flipped');
            flippedCards[1].classList.remove('flipped');
            flippedCards[0].textContent = '';
            flippedCards[1].textContent = '';
            flippedCards = [];
          }, 800);
        }
      }
    }

    /* ---------------- 3. STAR MATH QUEST ---------------- */
    let mathScore = 0;
    let correctAnswer = 0;

    function initMathGame() {
      mathScore = 0;
      gameArea.innerHTML = `
        <div class="score-board">Stars: <span id="m-score">0</span> 🌟</div>
        <div class="math-card">
          <div class="math-problem" id="problem">? + ?</div>
          <div class="math-options" id="options"></div>
        </div>
      `;
      nextMathProblem();
    }

    function nextMathProblem() {
      const num1 = Math.floor(Math.random() * 9) + 1;
      const num2 = Math.floor(Math.random() * 9) + 1;
      correctAnswer = num1 + num2;

      document.getElementById('problem').textContent = `${num1} + ${num2} = ?`;

      const options = new Set([correctAnswer]);
      while (options.size < 4) {
        options.add(Math.floor(Math.random() * 18) + 2);
      }

      const optionsArray = Array.from(options).sort(() => Math.random() - 0.5);
      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      optionsArray.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'math-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          if (opt === correctAnswer) {
            playWowSound();
            mathScore += 1;
            document.getElementById('m-score').textContent = mathScore;
            checkMilestoneScore(mathScore);
            nextMathProblem();
          } else {
            playWrongSound();
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    /* ---------------- 4. COLOR MATCH GAME ---------------- */
    const colorGamePalette = {
      RED: '#ff4757',
      GREEN: '#2ed573',
      BLUE: '#1e90ff',
      YELLOW: '#ffe66d',
      PURPLE: '#9b59b6',
      ORANGE: '#ffa502'
    };
    let colorGameScore = 0;

    function initColorGame() {
      colorGameScore = 0;
      gameArea.innerHTML = `
        <div class="score-board">Score: <span id="color-score">0</span> 🌈</div>
        <div class="target-cue">Tap the <span id="color-target" style="color:#ff4757">RED</span> color!</div>
        <div class="color-grid" id="color-grid"></div>
      `;
      nextColorRound();
    }

    function nextColorRound() {
      const paletteEntries = Object.entries(colorGamePalette);
      const targetIndex = Math.floor(Math.random() * paletteEntries.length);
      const [targetName, targetColor] = paletteEntries[targetIndex];
      const targetSpan = document.getElementById('color-target');
      if (targetSpan) {
        targetSpan.textContent = targetName;
        targetSpan.style.color = targetColor;
      }

      const options = [...paletteEntries].sort(() => Math.random() - 0.5).slice(0, 4);
      if (!options.some(([name]) => name === targetName)) {
        const replaceIndex = Math.floor(Math.random() * options.length);
        options[replaceIndex] = [targetName, targetColor];
      }

      const grid = document.getElementById('color-grid');
      if (!grid) return;
      grid.innerHTML = '';

      options.forEach(([name, color]) => {
        const tile = document.createElement('button');
        tile.className = 'color-tile';
        tile.textContent = name;
        tile.style.background = color;
        tile.onclick = () => {
          if (name === targetName) {
            playWowSound();
            colorGameScore += 10;
            document.getElementById('color-score').textContent = colorGameScore;
            checkMilestoneScore(colorGameScore);
            nextColorRound();
          } else {
            playWrongSound();
          }
        };
        grid.appendChild(tile);
      });
    }

    /* ---------------- 5. NUMBER HOP GAME ---------------- */
    let numberGameScore = 0;

    function initNumberGame() {
      numberGameScore = 0;
      gameArea.innerHTML = `
        <div class="score-board">Stars: <span id="number-score">0</span> 🔢</div>
        <div class="math-card">
          <div class="target-cue" id="number-target" style="font-size:2.3rem;">⭐</div>
          <div class="number-grid" id="number-grid"></div>
        </div>
      `;
      nextNumberRound();
    }

    function nextNumberRound() {
      const target = Math.floor(Math.random() * 9) + 1;
      const targetLabel = Array(target).fill('⭐').join(' ');
      const targetElement = document.getElementById('number-target');
      if (targetElement) {
        targetElement.textContent = targetLabel;
      }

      const options = new Set([target]);
      while (options.size < 4) {
        options.add(Math.floor(Math.random() * 9) + 1);
      }

      const optionsArray = Array.from(options).sort(() => Math.random() - 0.5);
      const grid = document.getElementById('number-grid');
      if (!grid) return;
      grid.innerHTML = '';

      optionsArray.forEach(value => {
        const btn = document.createElement('button');
        btn.className = 'number-btn';
        btn.textContent = value;
        btn.onclick = () => {
          if (value === target) {
            playWowSound();
            numberGameScore += 10;
            document.getElementById('number-score').textContent = numberGameScore;
            checkMilestoneScore(numberGameScore);
            nextNumberRound();
          } else {
            playWrongSound();
          }
        };
        grid.appendChild(btn);
      });
    }

    // Start default game on load
    const alphabetColors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#ff6348', '#00d2d3', '#ffb348', '#ff7675', '#a29bfe', '#fd79a8', '#fdcb6e', '#6c5ce7', '#74b9ff', '#81ecec', '#55efc4', '#fab1a0', '#ff7675', '#fd79a8', '#fdcb6e', '#6c5ce7', '#74b9ff', '#81ecec', '#55efc4', '#fab1a0', '#ff7675'];
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    let currentLetterIndex = 0;
    let isDrawing = false;
    let drawingCanvas = null;
    let ctx = null;
    let isCompletionPlaying = false;

    function initAlphabetGame() {
      currentLetterIndex = 0;
      gameArea.innerHTML = `
        <div class="score-board">Letter: <span id="abc-letter">A</span> (1/26) 📝</div>
        <canvas id="drawing-canvas" width="500" height="350"></canvas>
        <div class="alphabet-controls">
          <div style="display: flex; gap: 5px; flex-wrap: wrap; justify-content: center;" id="letter-grid"></div>
        </div>
        <div class="canvas-controls">
          <button class="control-btn" onclick="clearDrawing()">🗑️ Clear</button>
          <button class="control-btn" onclick="nextLetter()">✓ Next Letter</button>
        </div>
      `;

      drawingCanvas = document.getElementById('drawing-canvas');
      ctx = drawingCanvas.getContext('2d');
      
      // Setup event listeners
      drawingCanvas.addEventListener('mousedown', startDrawing);
      drawingCanvas.addEventListener('mousemove', draw);
      drawingCanvas.addEventListener('mouseup', stopDrawing);
      drawingCanvas.addEventListener('mouseout', stopDrawing);
      
      // Touch events for mobile
      drawingCanvas.addEventListener('touchstart', handleTouch);
      drawingCanvas.addEventListener('touchmove', handleTouch);
      drawingCanvas.addEventListener('touchend', stopDrawing);

      renderLetterGrid();
      drawDashedLetter(currentLetterIndex);
    }

    function renderLetterGrid() {
      const grid = document.getElementById('letter-grid');
      grid.innerHTML = '';
      alphabet.forEach((letter, idx) => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.textContent = letter;
        btn.style.backgroundColor = alphabetColors[idx];
        btn.style.color = '#fff';
        if (idx === currentLetterIndex) {
          btn.classList.add('active');
        }
        btn.onclick = () => {
          currentLetterIndex = idx;
          renderLetterGrid();
          clearDrawing();
          drawDashedLetter(idx);
          document.getElementById('abc-letter').textContent = letter;
          document.getElementById('abc-letter').style.color = alphabetColors[idx];
        };
        grid.appendChild(btn);
      });
    }

    function drawDashedLetter(index) {
      // Clear canvas
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, drawingCanvas.width, drawingCanvas.height);

      // Draw dashed outline and guide
      const letter = alphabet[index];
      const color = alphabetColors[index];

      // Draw a light background grid
      ctx.strokeStyle = 'rgba(200, 200, 200, 0.2)';
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1;

      // Draw dashed letter as guide
      ctx.font = 'bold 180px Arial';
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.setLineDash([15, 10]);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeText(letter, 250, 175);

      // Draw light fill to show the letter shape
      ctx.fillStyle = `${color}20`;
      ctx.fillText(letter, 250, 175);

      ctx.setLineDash([]);
    }

    function startDrawing(e) {
      const rect = drawingCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (!isPointInsideLetter(x, y)) {
        isDrawing = false;
        return;
      }

      isDrawing = true;
      const color = alphabetColors[currentLetterIndex];
      ctx.strokeStyle = color;
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function handleTouch(e) {
      const touch = e.touches[0] || e.changedTouches[0];
      const rect = drawingCanvas.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      const y = touch.clientY - rect.top;

      if (e.type === 'touchend') {
        isDrawing = false;
        ctx.closePath();
        checkLetterCompletion();
        e.preventDefault();
        return;
      }

      isDrawing = true;
      const color = alphabetColors[currentLetterIndex];
      ctx.strokeStyle = color;
      ctx.lineWidth = 20;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (e.type === 'touchstart') {
        ctx.beginPath();
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      e.preventDefault();
    }

    function draw(e) {
      if (!isDrawing) return;
      
      const rect = drawingCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (!isPointInsideLetter(x, y)) {
        return;
      }
      
      ctx.lineWidth = 8;
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
      ctx.closePath();
      checkLetterCompletion();
    }

    function clearDrawing() {
      isCompletionPlaying = false;
      drawDashedLetter(currentLetterIndex);
    }

    function buildLetterMask(index) {
      const maskCanvas = document.createElement('canvas');
      maskCanvas.width = drawingCanvas.width;
      maskCanvas.height = drawingCanvas.height;
      const maskCtx = maskCanvas.getContext('2d');
      const letter = alphabet[index];

      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      maskCtx.fillStyle = '#000000';
      maskCtx.textAlign = 'center';
      maskCtx.textBaseline = 'middle';
      maskCtx.font = 'bold 220px Arial';
      maskCtx.fillText(letter, 250, 175);

      return maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
    }

    function isPointInsideLetter(x, y) {
      const safeX = Math.max(0, Math.min(drawingCanvas.width - 1, Math.floor(x)));
      const safeY = Math.max(0, Math.min(drawingCanvas.height - 1, Math.floor(y)));
      const maskData = buildLetterMask(currentLetterIndex).data;
      const index = (safeY * drawingCanvas.width + safeX) * 4;
      return maskData[index + 3] > 0;
    }

    function checkLetterCompletion() {
      if (isCompletionPlaying) return;

      const originalData = ctx.getImageData(0, 0, drawingCanvas.width, drawingCanvas.height).data;
      const maskData = buildLetterMask(currentLetterIndex).data;
      let drawnInsideLetter = 0;
      let totalLetterPixels = 0;

      for (let i = 0; i < maskData.length; i += 4) {
        const maskAlpha = maskData[i + 3];
        if (maskAlpha > 0) {
          totalLetterPixels++;
          const r = originalData[i];
          const g = originalData[i + 1];
          const b = originalData[i + 2];
          const a = originalData[i + 3];

          if ((r < 240 || g < 240 || b < 240) && a > 50) {
            drawnInsideLetter++;
          }
        }
      }

      const coverage = totalLetterPixels > 0 ? (drawnInsideLetter / totalLetterPixels) * 100 : 0;
      console.log('coverage', coverage)
      if (coverage >= 69.50) {
        isCompletionPlaying = true;
        playCelebrationSound();
        setTimeout(() => autoAdvanceLetter(), 1200);
      }
    }

    function playCelebrationSound() {
      // Play a series of ascending tones for celebration
      const tones = [523.25, 587.33, 659.25, 783.99];
      let toneIndex = 0;
      
      function playNextTone() {
        if (toneIndex < tones.length) {
          playTone(tones[toneIndex], 0.2);
          toneIndex++;
          setTimeout(playNextTone, 150);
        }
      }
      
      playNextTone();
    }

    function autoAdvanceLetter() {
      if (currentLetterIndex < alphabet.length - 1) {
        currentLetterIndex++;
        renderLetterGrid();
        clearDrawing();
        drawDashedLetter(currentLetterIndex);
        document.getElementById('abc-letter').textContent = alphabet[currentLetterIndex];
        document.getElementById('abc-letter').style.color = alphabetColors[currentLetterIndex];
        isCompletionPlaying = false;
      } else {
        playCelebrationSound();
        setTimeout(() => {
          alert('🌟✨ Fantastic! You traced all 26 letters! You\'re an alphabet master! ✨🌟');
          currentLetterIndex = 0;
          isCompletionPlaying = false;
          renderLetterGrid();
          clearDrawing();
          drawDashedLetter(0);
          document.getElementById('abc-letter').textContent = 'A';
          document.getElementById('abc-letter').style.color = alphabetColors[0];
        }, 1000);
      }
    }

    function nextLetter() {
      if (currentLetterIndex < alphabet.length - 1) {
        currentLetterIndex++;
        isCompletionPlaying = false;
        renderLetterGrid();
        clearDrawing();
        drawDashedLetter(currentLetterIndex);
        document.getElementById('abc-letter').textContent = alphabet[currentLetterIndex];
        document.getElementById('abc-letter').style.color = alphabetColors[currentLetterIndex];
        playTone(523.25); // Success sound
      } else {
        playCelebrationSound();
        setTimeout(() => {
          alert('🌟✨ Fantastic! You traced all 26 letters! You\'re an alphabet master! ✨🌟');
          currentLetterIndex = 0;
          isCompletionPlaying = false;
          renderLetterGrid();
          clearDrawing();
          drawDashedLetter(0);
          document.getElementById('abc-letter').textContent = 'A';
          document.getElementById('abc-letter').style.color = alphabetColors[0];
        }, 1000);
      }
    }

    // Milestone dialog
    function showMilestoneDialog(score) {
      const overlay = document.createElement('div');
      overlay.className = 'milestone-overlay';

      const card = document.createElement('div');
      card.className = 'milestone-card';

      const icon = document.createElement('div');
      icon.className = 'milestone-icon';
      icon.textContent = '🏆';

      const text = document.createElement('div');
      text.className = 'milestone-text';
      text.textContent = `Amazing! Keep it up and Keep going!`;

      card.appendChild(icon);
      card.appendChild(text);
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      setTimeout(() => {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 250);
      }, 5000);
    }

    // Score check and milestone trigger
    function checkAndTriggerMilestone(score) {
      if (score > 0 && score % 100 === 0) {
        playWowSound();
        showMilestoneDialog(score);
      }
    }

    /* ---------------- OVERRIDE GAME INIT FUNCTIONS TO INCLUDE MILESTONE CHECK ---------------- */
    function initBalloonGame() {
      balloonScore = 0;
      pickNewTargetColor();

      gameArea.innerHTML = `
        <div class="score-board">Score: <span id="b-score">0</span> ⭐</div>
        <div class="target-cue">Pop the <span id="b-target" style="color:${balloonTargetColor}">COLOR</span> balloon!</div>
        <div id="balloon-box"></div>
      `;
      updateTargetDisplay();

      balloonInterval = setInterval(spawnBalloon, 900);
    }

    function spawnBalloon() {
      const box = document.getElementById('balloon-box');
      if (!box) return;

      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      const color = colors[Math.floor(Math.random() * colors.length)];
      balloon.style.backgroundColor = color;
      balloon.style.color = color;
      balloon.style.left = Math.random() * (box.clientWidth - 60) + 'px';

      balloon.onclick = () => {
        if (color === balloonTargetColor) {
          playWowSound();
          balloonScore += 10;
          document.getElementById('b-score').textContent = balloonScore;
          checkAndTriggerMilestone(balloonScore);
          if (balloonScore % 30 === 0) {
            pickNewTargetColor();
            updateTargetDisplay();
          }
        } else {
          playWrongSound();
        }
        balloon.remove();
      };

      balloon.onanimationend = () => balloon.remove();
      box.appendChild(balloon);
    }

    function initMemoryGame() {
      matchedPairs = 0;
      flippedCards = [];
      const deck = [...animals, ...animals].sort(() => Math.random() - 0.5);

      gameArea.innerHTML = `
        <div class="score-board">Pairs Found: <span id="mem-score">0 / 6</span> 🎉</div>
        <div class="memory-grid" id="grid"></div>
      `;

      const grid = document.getElementById('grid');
      deck.forEach((animal, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.animal = animal;
        card.dataset.index = index;
        card.onclick = () => flipCard(card);
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
        return;
      }

      card.classList.add('flipped');
      card.textContent = card.dataset.animal;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        if (flippedCards[0].dataset.animal === flippedCards[1].dataset.animal) {
          playWowSound();
          flippedCards[0].classList.add('matched');
          flippedCards[1].classList.add('matched');
          flippedCards = [];
          matchedPairs++;
          document.getElementById('mem-score').textContent = `${matchedPairs} / 6`;
          checkAndTriggerMilestone(matchedPairs);
          if (matchedPairs === 6) {
            setTimeout(() => alert('🌟 Great job! You found all the animal pairs! 🌟'), 300);
          }
        } else {
          playWrongSound();
          setTimeout(() => {
            flippedCards[0].classList.remove('flipped');
            flippedCards[1].classList.remove('flipped');
            flippedCards[0].textContent = '';
            flippedCards[1].textContent = '';
            flippedCards = [];
          }, 800);
        }
      }
    }

    function initMathGame() {
      mathScore = 0;
      gameArea.innerHTML = `
        <div class="score-board">Stars: <span id="m-score">0</span> 🌟</div>
        <div class="math-card">
          <div class="math-problem" id="problem">? + ?</div>
          <div class="math-options" id="options"></div>
        </div>
      `;
      nextMathProblem();
    }

    function nextMathProblem() {
      const num1 = Math.floor(Math.random() * 9) + 1;
      const num2 = Math.floor(Math.random() * 9) + 1;
      correctAnswer = num1 + num2;

      document.getElementById('problem').textContent = `${num1} + ${num2} = ?`;

      const options = new Set([correctAnswer]);
      while (options.size < 4) {
        options.add(Math.floor(Math.random() * 18) + 2);
      }

      const optionsArray = Array.from(options).sort(() => Math.random() - 0.5);
      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      optionsArray.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'math-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          if (opt === correctAnswer) {
            playWowSound();
            mathScore += 1;
            document.getElementById('m-score').textContent = mathScore;
            checkMilestoneScore(mathScore);
            nextMathProblem();
          } else {
            playWrongSound();
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    function initColorGame() {
      colorGameScore = 0;
      gameArea.innerHTML = `
        <div class="score-board">Score: <span id="color-score">0</span> 🌈</div>
        <div class="target-cue">Tap the <span id="color-target" style="color:#ff4757">RED</span> color!</div>
        <div class="color-grid" id="color-grid"></div>
      `;
      nextColorRound();
    }

    function nextColorRound() {
      const paletteEntries = Object.entries(colorGamePalette);
      const targetIndex = Math.floor(Math.random() * paletteEntries.length);
      const [targetName, targetColor] = paletteEntries[targetIndex];
      const targetSpan = document.getElementById('color-target');
      if (targetSpan) {
        targetSpan.textContent = targetName;
        targetSpan.style.color = targetColor;
      }

      const options = [...paletteEntries].sort(() => Math.random() - 0.5).slice(0, 4);
      if (!options.some(([name]) => name === targetName)) {
        const replaceIndex = Math.floor(Math.random() * options.length);
        options[replaceIndex] = [targetName, targetColor];
      }

      const grid = document.getElementById('color-grid');
      if (!grid) return;
      grid.innerHTML = '';

      options.forEach(([name, color]) => {
        const tile = document.createElement('button');
        tile.className = 'color-tile';
        tile.textContent = name;
        tile.style.background = color;
        tile.onclick = () => {
          if (name === targetName) {
            playWowSound();
            colorGameScore += 10;
            document.getElementById('color-score').textContent = colorGameScore;
            checkMilestoneScore(colorGameScore);
            nextColorRound();
          } else {
            playWrongSound();
          }
        };
        grid.appendChild(tile);
      });
    }

    function initNumberGame() {
      numberGameScore = 0;
      gameArea.innerHTML = `
        <div class="score-board">Stars: <span id="number-score">0</span> 🔢</div>
        <div class="math-card">
          <div class="target-cue" id="number-target" style="font-size:2.3rem;">⭐</div>
          <div class="number-grid" id="number-grid"></div>
        </div>
      `;
      nextNumberRound();
    }

    function nextNumberRound() {
      const target = Math.floor(Math.random() * 9) + 1;
      const targetLabel = Array(target).fill('⭐').join(' ');
      const targetElement = document.getElementById('number-target');
      if (targetElement) {
        targetElement.textContent = targetLabel;
      }

      const options = new Set([target]);
      while (options.size < 4) {
        options.add(Math.floor(Math.random() * 9) + 1);
      }

      const optionsArray = Array.from(options).sort(() => Math.random() - 0.5);
      const grid = document.getElementById('number-grid');
      if (!grid) return;
      grid.innerHTML = '';

      optionsArray.forEach(value => {
        const btn = document.createElement('button');
        btn.className = 'number-btn';
        btn.textContent = value;
        btn.onclick = () => {
          if (value === target) {
            playWowSound();
            numberGameScore += 10;
            document.getElementById('number-score').textContent = numberGameScore;
            checkMilestoneScore(numberGameScore);
            nextNumberRound();
          } else {
            playWrongSound();
          }
        };
        grid.appendChild(btn);
      });
    }

    // Start default game on load
    initBalloonGame();
  </script>
